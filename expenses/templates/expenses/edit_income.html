{% extends 'expenses/base.html' %}
{% block title %}Edit income · Smart Spend{% endblock %}
{% block content %}
<div class="auth-wrap" style="margin-top:4vh;">
  <div class="card">
    <div class="card-head"><span class="card-title"><i class="ti ti-edit text-accent" aria-hidden="true"></i> Edit income</span></div>
    <form method="POST" class="stack" style="gap:14px;">
      {% csrf_token %}
      <div><label class="field">Source</label><input class="input" type="text" name="source" value="{{ income.source }}" required></div>
      <div><label class="field">Amount</label><input class="input" type="number" step="0.01" min="0.01" name="amount" value="{{ income.amount }}" required></div>
      <div><label class="field">Date</label><input class="input" type="date" name="date" value="{{ income.date|date:'Y-m-d' }}" required></div>
      <div class="flex gap-12" style="margin-top:6px;">
        <button class="btn btn-primary" type="submit">Save changes</button>
        <a href="{% url 'monthly_report' %}?month={{ income.date|date:'Y-m' }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
